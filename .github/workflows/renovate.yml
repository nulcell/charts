name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: renovate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.3
        with:
          configurationFile: .github/renovate-global.json5
          token: "${{ secrets.RENOVATE_TOKEN }}"
        env:
          LOG_LEVEL: debug
          RENOVATE_HOST_RULES: >-
            [{"hostType":"docker","matchHost":"docker.io","username":"${{ secrets.DOCKERHUB_USERNAME }}","password":"${{
            secrets.DOCKERHUB_TOKEN }}"}]
