{{- range $key, $sa := .Values.serviceAccounts }}
{{- if ne $sa.create false }}
{{- $name := include "at.serviceAccountName" (list $ $key) }}
---
apiVersion: v1
kind: ServiceAccount
{{ include "at.metadata" (dict "ctx" $ "name" $name "annotations" $sa.annotations) }}
automountServiceAccountToken: {{ $sa.automount | default false }}
{{- with $sa.rules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
{{ include "at.metadata" (dict "ctx" $ "name" $name) }}
rules:
  {{- toYaml . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
{{ include "at.metadata" (dict "ctx" $ "name" $name) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
