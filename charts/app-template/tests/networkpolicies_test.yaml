suite: networkpolicies
templates: [networkpolicies.yaml]
release: {name: app}
set:
  workloads:
    api:
      containers: {api: {image: {repository: x}, ports: {http: 8080}}}
      services: {api: {ports: {http: 80}}}
      networkPolicy: {ingress: [gateway], egress: [{datastore: db}]}
  datastores:
    db: {engine: postgres, type: cnpg}
tests:
  - it: opens the gateway on the container port behind each service
    documentIndex: 0
    asserts:
      - equal:
          path: spec.ingress[0]
          value: {fromEntities: [ingress], toPorts: [{ports: [{port: "8080", protocol: TCP}]}]}
  - it: always allows DNS and nothing implicit beyond it
    documentIndex: 0
    asserts:
      - lengthEqual: {path: spec.egress, count: 2}
      - equal: {path: 'spec.egress[1].toEndpoints[0].matchLabels["cnpg.io/cluster"]', value: app-db}
  - it: opens the datastore to the workloads that list it
    documentIndex: 1
    asserts:
      - equal: {path: metadata.name, value: app-db}
      - equal: {path: 'spec.ingress[0].fromEndpoints[0].matchLabels["app.kubernetes.io/component"]', value: api}
  - it: puts a workload with no ingress into default-deny
    set:
      workloads.api.networkPolicy.ingress: []
    documentIndex: 0
    asserts:
      - equal: {path: 'spec.ingress[0].fromEndpoints[0].matchExpressions[0].operator', value: DoesNotExist}
