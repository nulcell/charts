suite: networkpolicies
templates: [networkpolicies.yaml]
release: {name: app}
set:
  workloads:
    api:
      containers: {api: {image: {repository: x}, ports: {http: 8080}}}
      services: {api: {ports: {http: 80}}}
      networkPolicy: {ingress: [gateway], egress: [{datastore: db}]}
  datastores:
    db: {engine: postgres, type: cnpg}
tests:
  - it: opens the gateway on the container port behind each service
    documentIndex: 0
    asserts:
      - equal:
          path: spec.ingress[0]
          value: {fromEntities: [ingress], toPorts: [{ports: [{port: "8080", protocol: TCP}]}]}
  - it: always allows DNS and nothing implicit beyond it
    documentIndex: 0
    asserts:
      - lengthEqual: {path: spec.egress, count: 2}
      - equal: {path: 'spec.egress[1].toEndpoints[0].matchLabels["cnpg.io/cluster"]', value: app-db}
  - it: opens the datastore to the workloads that list it
    documentIndex: 1
    asserts:
      - equal: {path: metadata.name, value: app-db}
      - equal: {path: 'spec.ingress[0].fromEndpoints[0].matchLabels["app.kubernetes.io/component"]', value: api}
  - it: puts a workload with no ingress into default-deny
    set:
      workloads.api.networkPolicy.ingress: []
    documentIndex: 0
    asserts:
      - equal: {path: 'spec.ingress[0].fromEndpoints[0].matchExpressions[0].operator', value: DoesNotExist}
  - it: derives egress peers for external datastores per host
    set:
      datastores.ext: {engine: mysql, type: external, hosts: [10.0.0.5, legacy, pg-rw.databases.svc]}
      workloads.api.networkPolicy.egress: [{datastore: ext}]
    documentIndex: 0
    asserts:
      - equal: {path: 'spec.egress[1].toCIDR', value: [10.0.0.5/32]}
      - equal: {path: 'spec.egress[2].toEndpoints[0].matchLabels["k8s:io.kubernetes.pod.namespace"]', value: NAMESPACE}
      - equal: {path: 'spec.egress[3].toEndpoints[0].matchLabels["k8s:io.kubernetes.pod.namespace"]', value: databases}
      - equal: {path: 'spec.egress[3].toPorts[0].ports[0].port', value: "3306"}
  - it: requires a port for engines without a default
    set:
      datastores.ext: {engine: mongodb, type: external, host: mongo}
    asserts:
      - failedTemplate: {errorMessage: 'datastores.ext.port is required for engine "mongodb"'}
  - it: skips refs to disabled peers but still fails on unknown ones
    set:
      workloads.mail: {enabled: false, containers: {mail: {image: {repository: x}}}}
      workloads.api.networkPolicy.egress: [{workload: mail}, {datastore: db}]
    documentIndex: 0
    asserts:
      - lengthEqual: {path: spec.egress, count: 2}
  - it: fails on an unknown peer
    set:
      workloads.api.networkPolicy.egress: [{workload: nope}]
    asserts:
      - failedTemplate: {errorMessage: 'workloads.api.networkPolicy.egress[0]: unknown workload "nope"'}
  - it: opens datastore egress to the listed peers
    set:
      datastores.db.networkPolicy.egress: [{fqdn: s3.amazonaws.com}, {fqdn: "*.s3.amazonaws.com"}]
    documentIndex: 1
    asserts:
      - lengthEqual: {path: spec.egress, count: 5}
      - equal: {path: 'spec.egress[3].toFQDNs[0].matchName', value: s3.amazonaws.com}
      - equal: {path: 'spec.egress[4].toFQDNs[0].matchPattern', value: "*.s3.amazonaws.com"}
