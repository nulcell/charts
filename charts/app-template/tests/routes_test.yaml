suite: routes
templates: [routes.yaml]
release: {name: app}
set:
  defaults.route.parentRefs: [{name: gw, namespace: gateway}]
  workloads.api:
    containers: {api: {image: {repository: x}}}
    services: {api: {ports: {http: 80}}, admin: {ports: {admin: 9000}}}
tests:
  - it: resolves backends to service names and port numbers
    set:
      routes.api.rules: [{backends: [{workload: api, service: admin, port: admin}]}]
    asserts:
      - equal: {path: 'spec.parentRefs[0].name', value: gw}
      - equal: {path: 'spec.rules[0].backendRefs[0].name', value: app-api-admin}
      - equal: {path: 'spec.rules[0].backendRefs[0].port', value: 9000}
  - it: fails on a dangling service
    set:
      routes.api.rules: [{backends: [{workload: api, service: nope, port: 80}]}]
    asserts:
      - failedTemplate: {errorMessage: 'routes.api.rules[0]: workload "api" has no service "nope"'}
  - it: follows workload and service name overrides
    set:
      workloads.api.name: legacy
      workloads.api.services.admin.name: legacy-admin
      routes.api: {name: legacy-route, rules: [{backends: [{workload: api, service: api, port: http}, {workload: api, service: admin, port: admin}]}]}
    asserts:
      - equal: {path: metadata.name, value: legacy-route}
      - equal: {path: 'spec.rules[0].backendRefs[0].name', value: legacy}
      - equal: {path: 'spec.rules[0].backendRefs[1].name', value: legacy-admin}
  - it: renders a backend-less rule to block paths
    set:
      routes.api.rules:
        - matches: [{path: {type: Exact, value: /metrics}}]
        - backends: [{workload: api, service: api, port: http}]
    asserts:
      - notExists: {path: 'spec.rules[0].backendRefs'}
      - equal: {path: 'spec.rules[1].backendRefs[0].name', value: app-api}
